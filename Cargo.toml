[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/kaeawc/pgmem"
homepage = "https://github.com/kaeawc/pgmem"
keywords = ["postgres", "postgresql", "testing", "database", "in-memory"]
categories = ["database-implementations", "development-tools::testing"]

# Every crate inherits deps from here, so each dependency is built with one feature set no matter
# which `-p` subset you build. New deps: `default-features = false` plus only the features used.
[workspace.dependencies]
pgmem-types = { path = "crates/pgmem-types", version = "=0.1.0" }
pgmem-ir = { path = "crates/pgmem-ir", version = "=0.1.0" }
pgmem-parse = { path = "crates/pgmem-parse", version = "=0.1.0" }
pgmem-catalog = { path = "crates/pgmem-catalog", version = "=0.1.0" }
pgmem-storage = { path = "crates/pgmem-storage", version = "=0.1.0" }
pgmem-exec = { path = "crates/pgmem-exec", version = "=0.1.0" }
pgmem-wire = { path = "crates/pgmem-wire", version = "=0.1.0" }
pgmem = { path = "crates/pgmem", version = "=0.1.0" }

getrandom = { version = "0.4", default-features = false, features = ["std"] }
md-5 = { version = "0.11", default-features = false }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
uuid = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order", "arbitrary_precision"] }
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
blowfish = { version = "0.10", default-features = false, features = ["bcrypt"] }
sqlparser = { version = "0.64", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
postgres = { version = "0.19", default-features = false, features = ["with-jiff-0_2", "with-serde_json-1", "with-uuid-1"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "tz-fat"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
await_holding_lock = "deny"

[profile.dev]
# Line tables keep backtraces useful at a fraction of full debuginfo's codegen + link time.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.release]
codegen-units = 16
incremental = true
strip = "debuginfo"

# CI: from-scratch builds where incremental state is never reused.
# `cargo nextest run --cargo-profile ci`.
[profile.ci]
inherits = "dev"
debug = false
incremental = false
