[package]
name = "pgmem"
description = "An in-memory, Postgres-wire-compatible database for tests. Fidelity over performance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
exclude = ["tests/"]

[lib]
doctest = false

[[bin]]
name = "pgmem"
path = "src/bin/pgmem.rs"
test = false

[dependencies]
pgmem-exec = { workspace = true }
pgmem-storage = { workspace = true }
pgmem-types = { workspace = true }
pgmem-wire = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pgmem-types = { workspace = true }
postgres = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

# `cargo binstall pgmem`: the archives attached to each GitHub release by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"
