[package]
name = "pgmem-clients"
description = "Client-compatibility suites (tokio-postgres, sqlx) run against a pgmem server or PostgreSQL."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Not part of the main workspace: sqlx brings its own dependency tree, which the workspace's
# one-version policy (deny.toml) does not govern. Pure Rust only: no TLS backends.
[workspace]

[lib]
doctest = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "derive", "json"] }
