name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run still going: only the latest commit matters.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  # Named after the check branch protection requires (formerly golangci-lint).
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings

  # Function complexity (clippy::cognitive_complexity, threshold in clippy.toml); the Rust
  # counterpart of the gocyclo check branch protection requires.
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
          save-if: false
      - run: cargo clippy --locked --workspace --lib --bins --profile ci -- -A clippy::all -D clippy::cognitive_complexity

  # Go's pgx driver running the sqlc example suites against the Rust server binary.
  pgx-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
          save-if: false
      - run: cargo build --locked --release -p pgmem
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/go.mod
          cache-dependency-path: examples/go.sum
      - run: go vet ./...
        working-directory: examples
      - run: go test -count=1 ./...
        working-directory: examples
        env:
          PGMEM_BIN: ${{ github.workspace }}/target/release/pgmem

  # Client compatibility: psql's output (describe commands, \copy, variables) must match
  # PostgreSQL's for the same scripts, and the tokio-postgres and sqlx suites (clients/rust, a
  # crate outside the workspace), node-postgres (clients/node) and psycopg 3 (clients/python)
  # suites pass against both pgmem and PostgreSQL.
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clients
          workspaces: |
            . -> target
            clients/rust -> target
          cache-on-failure: true
      - run: cargo build --locked --release -p pgmem
      - name: Install psql 18
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: psql --version
      - run: clients/psql/compare.sh target/release/pgmem postgres://postgres@127.0.0.1:5432/postgres
      - run: cargo fmt --manifest-path clients/rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path clients/rust/Cargo.toml --all-targets -- -D warnings
      - name: tokio-postgres and sqlx against pgmem
        run: cargo test --locked --manifest-path clients/rust/Cargo.toml
        env:
          PGMEM_BIN: ${{ github.workspace }}/target/release/pgmem
      - name: tokio-postgres and sqlx against PostgreSQL
        run: cargo test --locked --manifest-path clients/rust/Cargo.toml
        env:
          PGMEM_CLIENT_DSN: postgres://postgres@127.0.0.1:5432/postgres
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - run: npm ci --prefix clients/node
      - name: node-postgres against pgmem
        run: npm test --prefix clients/node
        env:
          PGMEM_BIN: ${{ github.workspace }}/target/release/pgmem
      - name: node-postgres against PostgreSQL
        run: npm test --prefix clients/node
        env:
          PGMEM_CLIENT_DSN: postgres://postgres@127.0.0.1:5432/postgres
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv clients/python/.venv && uv pip install --python clients/python/.venv/bin/python -r clients/python/requirements.txt
      - name: psycopg against pgmem
        run: clients/python/.venv/bin/pytest clients/python
        env:
          PGMEM_BIN: ${{ github.workspace }}/target/release/pgmem
      - name: psycopg against PostgreSQL
        run: clients/python/.venv/bin/pytest clients/python
        env:
          PGMEM_CLIENT_DSN: postgres://postgres@127.0.0.1:5432/postgres

  # Dependency policy (deny.toml): one version per crate, RustSec advisories, licenses, sources.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Every test against pgmem: unit tests in each crate plus the integration suite.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --cargo-profile ci --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The same integration suite against real PostgreSQL: proves every assertion in the suite is
  # real Postgres behaviour, not just pgmem's.
  postgres-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked -p pgmem --test it --cargo-profile ci --profile ci
        env:
          PGMEM_TEST_DSN: host=127.0.0.1 port=5432 user=postgres
      # The conformance corpus must describe real PostgreSQL exactly: every record passes.
      - run: cargo run --locked --profile ci -p pgmem-conformance -- --dsn "host=127.0.0.1 port=5432 user=postgres"

  # The conformance corpus against pgmem. Fails on a regression (a record outside
  # conformance/known_failures.txt fails) and on an unrecorded improvement (a known failure
  # passes, or CONFORMANCE.md is stale): run `cargo run -p pgmem-conformance -- --update`.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: false
      - run: cargo run --locked --profile ci -p pgmem-conformance

  # Every pgmem-go test has a Rust counterpart (parity/go_tests.tsv).
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/parity.py check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release -p pgmem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgmem-linux-x86_64
          path: target/release/pgmem
